name: Rewrite SGC iris security

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Conzumas' && !contains(github.event.head_commit.message, 'Rewrite SGC iris security')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite iris monitoring
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/sgc.lua')
          source = path.read_text(encoding='utf-8')

          old = '''    -- Iris telemetry stays live for a short period after a hit so the
    -- monitor remains visibly in an active/alarm state after an impact.
    iris_attack_hold_ms = 5000,
'''
          new = '''    -- Iris telemetry stays live for a short period after a hit so the
    -- monitor remains visibly in an active/alarm state after an impact.
    iris_attack_hold_ms = 5000,

    -- Must exactly match the GDO/iris code configured in the JSG Stargate GUI.
    -- Leave empty to fail closed: incoming connections will stay locked.
    gdo_code = "",
'''
          if old not in source:
              raise SystemExit('CONFIG iris anchor not found')
          source = source.replace(old, new, 1)

          old = '''    iris_last_damage = nil,
    iris_last_hit_at = nil,
    iris_attack_active = false,

    incoming = false,
'''
          new = '''    iris_last_damage = nil,
    iris_last_hit_at = nil,
    iris_attack_active = false,
    iris_authorized = false,

    incoming = false,
'''
          if old not in source:
              raise SystemExit('state iris anchor not found')
          source = source.replace(old, new, 1)

          old = '''    state.iris_durability_display = nil
    state.iris_durability = nil
    state.iris_max_durability = nil
end

local function find_gate()
'''
          new = '''    state.iris_durability_display = nil
    state.iris_durability = nil
    state.iris_max_durability = nil
    state.iris_authorized = false
end

local function find_gate()
'''
          if old not in source:
              raise SystemExit('clear iris state anchor not found')
          source = source.replace(old, new, 1)

          anchor = '''-----------------------------------------------------------------------
-- Address handling
-----------------------------------------------------------------------
'''
          security = '''-----------------------------------------------------------------------
-- Iris security
-----------------------------------------------------------------------

local function close_iris_for_incoming(reason)
    if not state.gate or not state.gate.toggleIris then
        state.alert = "!!! IRIS CONTROL UNAVAILABLE !!!"
        log_event("IRIS LOCK FAILED: toggleIris() unavailable")
        return false
    end

    if state.iris_state ~= "OPENED" and state.iris_state ~= "OPENING" then
        return true
    end

    local ok, success, code, message = safe_call(state.gate.toggleIris)
    local worked, detail = jsg_result(ok, success, code, message)
    if not worked then
        state.alert = "!!! IRIS LOCK FAILED !!!"
        log_event("IRIS LOCK FAILED: " .. detail)
        return false
    end

    log_event("IRIS CLOSED: " .. tostring(reason or "incoming security lock"))
    return true
end

local function process_gdo_code(received_code)
    state.iris_authorized = false

    if not state.incoming then
        log_event("GDO AUTH REJECTED: no incoming connection")
        return false
    end

    if type(CONFIG.gdo_code) ~= "string" or CONFIG.gdo_code == "" then
        state.alert = "!!! GDO CODE NOT CONFIGURED !!!"
        log_event("GDO AUTH REJECTED: local GDO code is not configured")
        return false
    end

    if tostring(received_code) ~= CONFIG.gdo_code then
        log_event("GDO AUTH REJECTED: invalid code")
        return false
    end

    if not state.gate or not state.gate.toggleIris then
        state.alert = "!!! IRIS CONTROL UNAVAILABLE !!!"
        log_event("GDO AUTHENTICATED BUT IRIS CONTROL IS UNAVAILABLE")
        return false
    end

    if state.iris_state == "CLOSED" then
        local ok, success, code, message = safe_call(state.gate.toggleIris)
        local worked, detail = jsg_result(ok, success, code, message)
        if not worked then
            state.alert = "!!! IRIS OPEN FAILED !!!"
            log_event("GDO AUTHENTICATED; IRIS OPEN FAILED: " .. detail)
            return false
        end
    elseif state.iris_state ~= "OPENED" then
        log_event("GDO AUTHENTICATED: iris state " .. tostring(state.iris_state or "UNKNOWN") .. "; waiting")
        state.iris_authorized = true
        return true
    end

    state.iris_authorized = true
    state.alert = nil
    log_event("GDO AUTHENTICATED: IRIS OPEN AUTHORIZED")
    return true
end

local function enforce_incoming_iris_lock()
    if state.incoming and not state.iris_authorized then
        close_iris_for_incoming("incoming connection")
    end
end

'''
          if anchor not in source:
              raise SystemExit('iris security insertion anchor not found')
          source = source.replace(anchor, security + anchor, 1)

          old = '''    if event == "stargate_wormhole_incoming" then
        local address_size = args[1]
        state.incoming = true
        state.incoming_address = "INCOMING DIAL (" .. tostring(address_size or "?") .. " SYMBOLS)"
        state.alert = "!!! INCOMING WORMHOLE !!!"
        set_alarm_audio("incoming", "incoming wormhole")
        log_event("INCOMING WORMHOLE DETECTED: " .. tostring(address_size or "unknown") .. " symbols")
'''
          new = '''    if event == "stargate_wormhole_incoming" then
        local address_size = args[1]
        state.incoming = true
        state.iris_authorized = false
        state.incoming_address = "INCOMING DIAL (" .. tostring(address_size or "?") .. " SYMBOLS)"
        state.alert = "!!! INCOMING WORMHOLE !!!"
        close_iris_for_incoming("incoming connection")
        set_alarm_audio("incoming", "incoming wormhole")
        log_event("INCOMING WORMHOLE DETECTED: " .. tostring(address_size or "unknown") .. " symbols")
'''
          if old not in source:
              raise SystemExit('incoming event block not found')
          source = source.replace(old, new, 1)

          old = '''    elseif event == "stargate_wormhole_close_fully" then
        local address, reason, initiating = args[1], args[2], args[3]
        state.dialing = false
'''
          new = '''    elseif event == "stargate_wormhole_close_fully" then
        local address, reason, initiating = args[1], args[2], args[3]
        state.iris_authorized = false
        state.dialing = false
'''
          if old not in source:
              raise SystemExit('wormhole close block not found')
          source = source.replace(old, new, 1)

          old = '''    elseif event == "stargate_iris_code_received" then
        log_event("GDO/IRIS CODE RECEIVED: JSG received a code")
'''
          new = '''    elseif event == "stargate_iris_code_received" then
        process_gdo_code(args[1])
'''
          if old not in source:
              raise SystemExit('iris code event block not found')
          source = source.replace(old, new, 1)

          old = '''local function refresh_loop()
    while state.running do
        ensure_gate()
        refresh_gate()
        sleep(CONFIG.refresh_interval)
    end
end
'''
          new = '''local function refresh_loop()
    while state.running do
        ensure_gate()
        refresh_gate()
        enforce_incoming_iris_lock()
        sleep(CONFIG.refresh_interval)
    end
end
'''
          if old not in source:
              raise SystemExit('refresh loop block not found')
          source = source.replace(old, new, 1)

          old = '''    term.clear()
    header("IRIS CONTROL / TELEMETRY")
'''
          new = '''    term.clear()
    header("IRIS CONTROL / SECURITY")
'''
          if old not in source:
              raise SystemExit('iris header not found')
          source = source.replace(old, new, 1)

          old = '''    term.setCursorPos(2, 5)
    term.write("CONTROL LINK: ONLINE / JSG-GDO TELEMETRY")
    term.setCursorPos(2, 6)
'''
          new = '''    term.setCursorPos(2, 5)
    term.write("CONTROL LINK: ONLINE / SGC IRIS SECURITY")
    term.setCursorPos(2, 6)
    term.write("GDO AUTH: " .. (CONFIG.gdo_code ~= "" and "CONFIGURED" or "NOT CONFIGURED") .. "   ACCESS: " .. (state.iris_authorized and "AUTHORIZED" or "LOCKED"))
    term.setCursorPos(2, 7)
'''
          if old not in source:
              raise SystemExit('iris monitor control line not found')
          source = source.replace(old, new, 1)

          old = '''    term.setCursorPos(2, 6)
    term.write("IRIS STATE:   " .. iris_state .. "   TYPE: " .. iris_type)
    term.setCursorPos(2, 7)
    term.write("DURABILITY:   " .. durability .. " / " .. percent)
    term.setCursorPos(2, 8)
'''
          new = '''    term.setCursorPos(2, 8)
    term.write("IRIS STATE:   " .. iris_state .. "   TYPE: " .. iris_type)
    term.setCursorPos(2, 9)
    term.write("DURABILITY:   " .. durability .. " / " .. percent)
    term.setCursorPos(2, 10)
'''
          if old not in source:
              raise SystemExit('iris monitor row block not found')
          source = source.replace(old, new, 1)

          # Shift the remaining fixed rows down to make room for GDO status.
          for old_y, new_y in [(8,11),(9,12),(10,13),(11,14),(12,15),(13,16),(14,17),(15,18),(16,19),(17,20)]:
              source = source.replace(f'term.setCursorPos(2, {old_y})', f'term.setCursorPos(2, {new_y})')

          path.write_text(source, encoding='utf-8')
      - name: Commit source and clean temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sgc.lua
          git rm .github/workflows/sgc-iris-rewrite.yml .github/workflows/fix-live-ui.yml .github/workflows/trigger-live-ui.yml
          git commit -m 'Rewrite SGC iris security'
          git push origin HEAD:main
