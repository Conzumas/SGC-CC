name: Fix glyph rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'Conzumas' && !contains(github.event.head_commit.message, 'Fix glyph rendering')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch glyph rendering
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          glyphs = Path('sgc_glyphs.lua')
          source = glyphs.read_text(encoding='utf-8')

          new_draw = r'''local function draw_symbols(display, symbols, page)
              local previous = term.redirect(display)

              if display.setTextScale then
                  display.setTextScale(0.5)
              end

              local width, height = display.getSize()
              local columns = 3
              local first_row = 6
              local footer_rows = 3
              local rows = math.max(1, math.min(13, height - first_row - footer_rows + 1))
              local per_page = rows * columns
              local pages = math.max(1, math.ceil(#symbols / per_page))
              page = math.max(1, math.min(page, pages))
              local page_first = (page - 1) * per_page + 1

              display.clear()
              display.setCursorPos(1, 1)
              display.write('S T A R G A T E   G L Y P H   R E F E R E N C E')
              display.setCursorPos(1, 2)
              display.write('================================================')
              display.setCursorPos(1, 3)
              display.write('CODE = JSG SYMBOL-MAP INDEX')
              display.setCursorPos(1, 4)
              display.write(string.format('PAGE %d / %d    %d SYMBOLS', page, pages, #symbols))

              for local_index = 0, per_page - 1 do
                  local index = page_first + local_index
                  if index > #symbols then
                      break
                  end

                  local column = math.floor(local_index / rows)
                  local row = local_index % rows
                  local column_width = math.floor(width / columns)
                  local x = 2 + column * column_width
                  local y = first_row + row
                  local symbol = symbols[index]
                  local text = string.format('[%02d] %s', index, tostring(symbol))

                  display.setCursorPos(x, y)
                  display.write(text:sub(1, math.max(1, column_width - 2)))
              end

              display.setCursorPos(1, height - 2)
              display.write('LEFT/RIGHT PAGE    B BACK / EXIT')
              display.setCursorPos(1, height - 1)
              display.write('INDEX = JSG MAP INDEX    ALL SYMBOLS ARE SHOWN')
              display.setCursorPos(1, height)
              display.write('SGC-CC | DEDICATED GLYPH REFERENCE')

              term.redirect(previous)
          end'''

          source, count = re.subn(r'local function draw_symbols\(display, symbols\).*?\nend\n\nlocal gate = find_gate\(\)', new_draw + "\n\nlocal gate = find_gate()", source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('draw_symbols block not found')

          source = source.replace('draw_symbols(monitor, symbols)\n', '''local page = 1
while true do
    draw_symbols(monitor, symbols, page)

    local _, key = os.pullEvent('key')
    if key == keys.left then
        page = math.max(1, page - 1)
    elseif key == keys.right then
        page = math.min(math.ceil(#symbols / 39), page + 1)
    elseif key == keys.b or key == keys.q then
        break
    end
end
''', 1)
          glyphs.write_text(source, encoding='utf-8')

          # Wide-terminal address picker: clear the whole screen once per frame;
          # do not call clearLine from individual columns, which can erase glyphs
          # already rendered elsewhere on the same monitor/row.
          sgc = Path('src/sgc.lua')
          source = sgc.read_text(encoding='utf-8')
          source = source.replace('            term.setCursorPos(x, y)\n            term.clearLine()\n            term.write(text:sub(1, math.max(1, column_width - 2)))', '            term.setCursorPos(x, y)\n            term.write(text:sub(1, math.max(1, column_width - 2)))', 1)
          sgc.write_text(source, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sgc_glyphs.lua src/sgc.lua
          git rm .github/workflows/fix-glyph-rendering.yml
          git commit -m 'Fix glyph rendering'
          git push origin HEAD:main
