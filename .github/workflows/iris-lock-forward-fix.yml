name: Repair iris lock forward reference

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repair once
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/iris-lock-forward-fix ]]; then
            echo "No repair marker; nothing to do."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/sgc.lua")
          text = path.read_text(encoding="utf-8")

          old_top = '''local CONFIG = {
'''
          new_top = '''local release_iris_lock

local CONFIG = {
'''
          if old_top not in text:
              raise SystemExit("CONFIG anchor not found")
          if "local release_iris_lock\n\nlocal CONFIG = {" not in text:
              text = text.replace(old_top, new_top, 1)

          old_def = '''local function release_iris_lock()
'''
          new_def = '''release_iris_lock = function()
'''
          if old_def not in text:
              raise SystemExit("release_iris_lock definition not found")
          text = text.replace(old_def, new_def, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sgc.lua
          git rm .github/iris-lock-forward-fix .github/workflows/iris-lock-forward-fix.yml
          git commit -m "Fix iris lock forward declaration"
          git push
