name: Iris fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply iris patch
        run: |
          sed -i 's/if count != 1:/if count not in (1, 2):/' patch_iris.py
          python3 patch_iris.py
      - name: Commit patch and clean up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f patch_iris.py .github/workflows/iris-fix.yml iris-fix-trigger.txt iris-fix-trigger-2.txt iris-fix-trigger-3.txt
          git add src/sgc.lua patch_iris.py .github/workflows/iris-fix.yml iris-fix-trigger.txt iris-fix-trigger-2.txt iris-fix-trigger-3.txt
          git commit -m 'chore: apply iris restoration fix'
          git push
