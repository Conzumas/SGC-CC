name: Apply SGC UI fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'github-actions[bot]' || github.actor == 'Conzumas'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/sgc.lua")
          source = path.read_text(encoding="utf-8")

          # Shared UI timer. Nested menus all consume and renew the same timer
          # so a timer event cannot be silently discarded by another menu.
          marker = '''local function remaining_time_text(epoch_ms)\n    if not epoch_ms then\n        return "UNKNOWN"\n    end\n\n    local delta = math.max(0, os.epoch("utc") - epoch_ms)\n    return string.format("%0.1fs AGO", delta / 1000)\nend\n'''
          timer_helpers = marker + '''\nlocal ui_timer = nil\n\nlocal function ensure_ui_timer()\n    if not ui_timer then\n        ui_timer = os.startTimer(CONFIG.refresh_interval)\n    end\n    return ui_timer\nend\n\nlocal function renew_ui_timer()\n    ui_timer = os.startTimer(CONFIG.refresh_interval)\n    return ui_timer\nend\n'''
          if marker not in source:
              raise SystemExit("shared timer marker not found")
          source = source.replace(marker, timer_helpers, 1)

          # Glyph picker: use a deliberate one-column layout on normal 51x19
          # terminals so every glyph name and index is unambiguously visible.
          # Wide terminals can use two columns. No timer is needed here: key
          # filtering prevents this picker from consuming the shared UI timer.
          glyph_picker = '''local function glyph_picker(initial_symbols)\n    local symbols = get_symbol_map()\n    if not symbols or #symbols == 0 then\n        log_event("GLYPH PICKER FAILED: unable to read the JSG symbol map")\n        return nil\n    end\n\n    local selected = {}\n    local order = {}\n    local selected_count = 0\n\n    for _, symbol in ipairs(initial_symbols or {}) do\n        local canonical = canonical_symbol(symbol, symbols)\n        local key = canonical and canonical:lower() or nil\n        if canonical and not selected[key] then\n            selected[key] = true\n            table.insert(order, canonical)\n            selected_count = selected_count + 1\n        end\n    end\n\n    local cursor = 1\n\n    while true do\n        local width, height = term.getSize()\n        local columns = width >= 80 and 2 or 1\n        local footer_rows = 3\n        local first_row = 6\n        local last_row = math.max(first_row, height - footer_rows - 1)\n        local rows = math.max(1, last_row - first_row + 1)\n        local per_page = rows * columns\n        local pages = math.max(1, math.ceil(#symbols / per_page))\n        local page = math.floor((cursor - 1) / per_page) + 1\n        local page_first = (page - 1) * per_page + 1\n\n        term.clear()\n        header("SELECT GLYPHS")\n        term.setCursorPos(2, 5)\n        term.write(string.format("SELECTED: %d / 9    PAGE %d / %d", selected_count, page, pages))\n\n        for local_index = 0, per_page - 1 do\n            local index = page_first + local_index\n            if index > #symbols then\n                break\n            end\n\n            local column = math.floor(local_index / rows)\n            local row = local_index % rows\n            local x = 2 + column * math.floor(width / columns)\n            local y = first_row + row\n            local symbol = symbols[index]\n            local key_name = tostring(symbol):lower()\n            local marker = selected[key_name] and "*" or " "\n            local cursor_marker = cursor == index and ">" or " "\n            local text = string.format("%s%s [%02d] %s", cursor_marker, marker, index, tostring(symbol))\n\n            term.setCursorPos(x, y)\n            term.clearLine()\n            term.write(text:sub(1, math.max(1, math.floor(width / columns) - 2)))\n        end\n\n        draw_controls({\n            "ARROWS MOVE   SPACE SELECT   ENTER ACCEPT   B CANCEL",\n            "LEFT/RIGHT PAGE   HOME/END FIRST/LAST   7-9 REQUIRED",\n            "* = SELECTED   INDEX = JSG MAP INDEX   POSITION = DIAL ORDER",\n        })\n\n        local _, key = os.pullEvent("key")\n\n        if key == keys.up then\n            local target = cursor - 1\n            if target >= 1 then\n                cursor = target\n            end\n\n        elseif key == keys.down then\n            local target = cursor + 1\n            if target <= #symbols then\n                cursor = target\n            end\n\n        elseif key == keys.left then\n            local page_start = page_first\n            if page > 1 then\n                cursor = page_start - per_page\n            end\n\n        elseif key == keys.right then\n            if page < pages then\n                cursor = math.min(#symbols, page_first + per_page)\n            end\n\n        elseif key == keys.home then\n            cursor = 1\n\n        elseif key == keys['end'] then\n            cursor = #symbols\n\n        elseif key == keys.space then\n            local symbol = symbols[cursor]\n            local key_name = tostring(symbol):lower()\n\n            if selected[key_name] then\n                selected[key_name] = nil\n                selected_count = selected_count - 1\n                for i, value in ipairs(order) do\n                    if tostring(value):lower() == key_name then\n                        table.remove(order, i)\n                        break\n                    end\n                end\n            elseif selected_count < 9 then\n                selected[key_name] = true\n                selected_count = selected_count + 1\n                table.insert(order, tostring(symbol))\n            end\n\n        elseif key == keys.enter then\n            if selected_count < 7 then\n                log_event("GLYPH PICKER: " .. tostring(selected_count) .. " selected; 7 minimum required")\n            else\n                return order\n            end\n\n        elseif key == keys.b then\n            return nil\n        end\n    end\nend\n'''
          source, count = re.subn(r'local function glyph_picker\(initial_symbols\).*?\nlocal function add_address\(\)', glyph_picker + "\nlocal function add_address()", source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("glyph picker block not replaced")

          # Dynamic main-screen last-event placement.
          old = '''    local _, height = term.getSize()\n    local last_y = math.max(21, height - 3)\n    term.setCursorPos(2, last_y)\n'''
          new = '''    local _, height = term.getSize()\n    local last_y = math.max(5, math.min(17, height - 3))\n    term.setCursorPos(2, last_y)\n'''
          if old not in source:
              raise SystemExit("main last-event block not found")
          source = source.replace(old, new, 1)

          # Replace the entire address menu so VIEW GLYPHS is a full-screen,
          # 7-9-line exact position/index/name reference and uses the shared UI timer.
          address_block = '''local function address_details_menu()\n    while state.running do\n        local entry = state.addresses[state.selected_address]\n        if not entry then\n            return\n        end\n\n        term.clear()\n        header("ADDRESS DETAILS")\n        term.setCursorPos(2, 5)\n        term.write("NAME: " .. tostring(entry.name):sub(1, 70))\n        term.setCursorPos(2, 6)\n        term.write("GLYPHS: " .. tostring(#entry.symbols) .. "   ADDRESS ORDER / JSG MAP INDEX / JSG NAME")\n\n        local width, height = term.getSize()\n        local first_row = 8\n        local last_row = math.max(first_row, height - 3)\n        local visible = math.max(1, last_row - first_row + 1)\n        local symbol_map = get_symbol_map() or {}\n\n        for pos = 1, math.min(#entry.symbols, visible) do\n            local symbol, map_index = canonical_symbol(entry.symbols[pos], symbol_map)\n            symbol = symbol or tostring(entry.symbols[pos])\n            term.setCursorPos(2, first_row + pos - 1)\n            term.write(string.format("%02d  MAP[%02d]  %-14s  %s", pos, tonumber(map_index) or 0, "POSITION " .. tostring(pos), symbol):sub(1, math.max(1, width - 2)))\n        end\n\n        if #entry.symbols > visible then\n            term.setCursorPos(2, last_row)\n            term.write("WARNING: DISPLAY TOO SHORT FOR ALL GLYPHS".sub(1, math.max(1, width - 2)))\n        end\n\n        draw_controls({\n            "D DIAL   E EDIT   R REMOVE",\n            "B BACK   UP/DOWN CHANGES ADDRESS SELECTION",\n            "MAP INDEX + JSG NAME = UNAMBIGUOUS GLYPH IDENTIFIER",
        })\n\n        local event, key = os.pullEvent("key")\n        if event == "key" then\n            if key == keys.d then\n                dial_saved(state.selected_address)\n            elseif key == keys.e then\n                edit_address(state.selected_address)\n            elseif key == keys.r then\n                remove_address(state.selected_address)\n            elseif key == keys.b then\n                return\n            elseif key == keys.up then\n                state.selected_address = math.max(1, state.selected_address - 1)\n            elseif key == keys.down then\n                if #state.addresses > 0 then\n                    state.selected_address = math.min(#state.addresses, state.selected_address + 1)\n                end\n            end\n        end\n    end\nend\n\nlocal function address_menu()\n    ensure_ui_timer()\n\n    while state.running do\n        draw_addresses()\n        local event, p1 = os.pullEvent()\n\n        if event == "key" then\n            local key = p1\n\n            if key == keys.up then\n                state.selected_address = math.max(1, state.selected_address - 1)\n            elseif key == keys.down then\n                if #state.addresses > 0 then\n                    state.selected_address = math.min(#state.addresses, state.selected_address + 1)\n                end\n            elseif key == keys.d then\n                dial_saved(state.selected_address)\n            elseif key == keys.a then\n                add_address()\n            elseif key == keys.e then\n                edit_address(state.selected_address)\n            elseif key == keys.r then\n                remove_address(state.selected_address)\n            elseif key == keys.v then\n                address_details_menu()\n            elseif key == keys.b then\n                return\n            end\n\n        elseif event == "timer" and p1 == ui_timer then\n            renew_ui_timer()\n        end\n    end\nend\n\n'''
          source, count = re.subn(r'local function address_menu\(\).*?\nlocal function draw_iris_monitor', address_block + 'local function draw_iris_monitor', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("address menu block not replaced")

          # Iris monitor: all telemetry must fit a standard 51x19 terminal.
          iris_block = '''local function draw_iris_monitor()\n    term.clear()\n    header("IRIS CONTROL / TELEMETRY")\n\n    local iris_state = tostring(state.iris_state or "UNKNOWN"):upper()\n    local iris_type = tostring(state.iris_type or "UNKNOWN"):upper()\n    local attack = state.iris_attack_active and "DETECTED" or "NONE"\n    local thermal = "NOT EXPOSED BY JSG CC API"\n    local durability = tostring(state.iris_durability_display or "UNKNOWN")\n    local current_max = "UNKNOWN"\n    local percent = "UNKNOWN"\n\n    if state.iris_durability and state.iris_max_durability then\n        current_max = tostring(state.iris_durability) .. " / " .. tostring(state.iris_max_durability)\n        if tonumber(state.iris_max_durability) and tonumber(state.iris_max_durability) > 0 then\n            percent = string.format("%d%%", math.floor((state.iris_durability / state.iris_max_durability) * 100 + 0.5))\n        end\n    end\n\n    local _, height = term.getSize()\n\n    term.setCursorPos(2, 5)\n    term.write("CONTROL LINK: ONLINE / JSG-GDO TELEMETRY")\n    term.setCursorPos(2, 6)\n    term.write("IRIS STATE:   " .. iris_state)\n    term.setCursorPos(2, 7)\n    term.write("IRIS TYPE:    " .. iris_type)\n    term.setCursorPos(2, 8)\n    term.write("DURABILITY:   " .. durability .. " / " .. percent)\n    term.setCursorPos(2, 9)\n    term.write("CURRENT/MAX:  " .. current_max)\n    term.setCursorPos(2, 10)\n    term.write("ATTACK MONITOR: " .. attack .. "   HITS: " .. tostring(state.iris_hit_count))\n    term.setCursorPos(2, 11)\n    term.write("DAMAGE TOTAL:  " .. tostring(state.iris_damage_total))\n    term.setCursorPos(2, 12)\n    term.write("LAST DAMAGE:   " .. tostring(state.iris_last_damage or "NONE"))\n    term.setCursorPos(2, 13)\n    term.write("LAST HIT:      " .. remaining_time_text(state.iris_last_hit_at))\n    term.setCursorPos(2, 14)\n    term.write("STATE CHANGE:  " .. tostring(state.iris_last_state_change or "NONE"))\n    term.setCursorPos(2, 15)\n    term.write("LAST CHANGE:   " .. remaining_time_text(state.iris_last_state_change_at))\n    term.setCursorPos(2, 16)\n    term.write("THERMAL:       " .. thermal)\n    term.setCursorPos(2, 17)\n    term.write("JSG: " .. tostring(state.jsg_version or "UNKNOWN") .. "  GATE: " .. tostring(state.gate_type or "UNKNOWN"))\n\n    if height >= 20 then\n        term.setCursorPos(2, 18)\n        term.write("SYMBOL TYPE: " .. tostring(state.symbol_type or "UNKNOWN"))\n    end\n\n    if state.alert then\n        local alert_row = math.max(5, math.min(height - 3, height >= 20 and 19 or 17))\n        term.setCursorPos(2, alert_row)\n        term.write("ALERT: " .. tostring(state.alert):sub(1, math.max(1, term.getSize() - 8)))\n    end\n\n    draw_controls({\n        "R FORCE REFRESH   B BACK",\n        "AUTO-REFRESH: LIVE TELEMETRY   SGC DISPLAY / JSG CONTROL AUTHORITY",\n    })\nend\n\nlocal function iris_monitor_menu()\n    ensure_ui_timer()\n\n    while state.running do\n        refresh_gate()\n        draw_iris_monitor()\n        local event, p1 = os.pullEvent()\n\n        if event == "key" then\n            if p1 == keys.r then\n                refresh_gate()\n                log_event("IRIS MONITOR REFRESH")\n            elseif p1 == keys.b then\n                return\n            end\n        elseif event == "timer" and p1 == ui_timer then\n            refresh_gate()\n            renew_ui_timer()\n        end\n    end\nend\n\n'''
          source, count = re.subn(r'local function draw_iris_monitor\(\).*?\nlocal function draw_log', iris_block + 'local function draw_log', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("iris monitor block not replaced")

          # Shared timer for event log and main UI.
          source, count = re.subn(r'local function log_menu\(\)\n    local timer = os.startTimer\(CONFIG.refresh_interval\).*?\nend\n\nlocal function ui_loop', '''local function log_menu()\n    ensure_ui_timer()\n\n    while state.running do\n        draw_log()\n        local event, p1 = os.pullEvent()\n        if event == "key" and p1 == keys.b then\n            return\n        elseif event == "timer" and p1 == ui_timer then\n            renew_ui_timer()\n        end\n    end\nend\n\nlocal function ui_loop''', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("log menu block not replaced")

          source, count = re.subn(r'local function ui_loop\(\)\n    local timer = os.startTimer\(CONFIG.refresh_interval\).*?\nend\n\n-----------------------------------------------------------------------\n-- Startup', '''local function ui_loop()\n    ensure_ui_timer()\n\n    while state.running do\n        draw_main()\n        local event, p1 = os.pullEvent()\n\n        if event == "key" then\n            if p1 == keys.one then\n                address_menu()\n            elseif p1 == keys.two then\n                dial_saved(state.selected_address)\n            elseif p1 == keys.three then\n                iris_monitor_menu()\n            elseif p1 == keys.four then\n                log_menu()\n            elseif p1 == keys.five then\n                ensure_gate()\n                refresh_gate()\n                log_event("MANUAL REFRESH")\n            elseif p1 == keys.q then\n                state.running = false\n            end\n        elseif event == "timer" and p1 == ui_timer then\n            renew_ui_timer()\n        end\n    end\nend\n\n-----------------------------------------------------------------------\n-- Startup''', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("ui loop block not replaced")

          path.write_text(source, encoding="utf-8")

      - name: Rewrite temporary workflow commit into final source commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ui-fixes.yml
          git add src/sgc.lua
          git reset --soft HEAD~1
          git add -A
          git commit -m "Fix SGC UI layout, shared timers, and glyph display"
          git push --force-with-lease origin HEAD:main
