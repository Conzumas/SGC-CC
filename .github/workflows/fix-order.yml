name: Fix persistence helper order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Conzumas' && !contains(github.event.head_commit.message, 'Fix persistence helper declaration order')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move save failure helper after log_event
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/sgc.lua')
          source = path.read_text(encoding='utf-8')

          block = '''local function report_data_save_failure(action, message)
    state.alert = "!!! ADDRESS DATA SAVE FAILED !!!"
    state.last_event = "ADDRESS DATA SAVE FAILED: " .. tostring(message or "unknown error")
    if action then
        state.last_event = "ADDRESS " .. tostring(action):upper() .. " SAVE FAILED: " .. tostring(message or "unknown error")
    end
    log_event(state.last_event)
end

'''
          if source.count(block) != 1:
              raise SystemExit('expected helper block not found exactly once')
          source = source.replace(block, '', 1)

          anchor = '''local function log_event(message)
    message = tostring(message)
    table.insert(state.events, now() .. "  " .. message)
    while #state.events > CONFIG.max_log_entries do
        table.remove(state.events, 1)
    end
    state.last_event = message
    save_events()
end

'''
          if source.count(anchor) != 1:
              raise SystemExit('expected log_event anchor not found exactly once')
          source = source.replace(anchor, anchor + block, 1)
          path.write_text(source, encoding='utf-8')
      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sgc.lua
          git rm .github/workflows/fix-order.yml
          git commit -m 'Fix persistence helper declaration order'
          git push origin HEAD:main
