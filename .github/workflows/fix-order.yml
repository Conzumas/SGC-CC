name: Fix persistence helper order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Conzumas' && !contains(github.event.head_commit.message, 'Fix persistence helper declaration order')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move save failure helper after log_event
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/sgc.lua')
          source = path.read_text(encoding='utf-8')

          start = source.index('local function report_data_save_failure(action, message)')
          end = source.index('local function load_data()', start)
          block = source[start:end]
          source = source[:start] + source[end:]

          anchor_start = source.index('local function log_event(message)')
          anchor_end = source.index('-----------------------------------------------------------------------\n-- UI helpers', anchor_start)
          source = source[:anchor_end] + '\n' + block.rstrip() + '\n\n' + source[anchor_end:]
          path.write_text(source, encoding='utf-8')
      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add src/sgc.lua
          git rm .github/workflows/fix-order.yml
          git commit -m 'Fix persistence helper declaration order'
          git push origin HEAD:main
