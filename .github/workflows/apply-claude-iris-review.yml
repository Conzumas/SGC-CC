name: Apply Claude Iris Review Patch

on:
  push:
    paths:
      - '.github/workflows/apply-claude-iris-review.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 -c "import base64;from pathlib import Path;p=Path('src/sgc.lua');s=p.read_text();old=base64.b64decode('').decode();new=base64.b64decode('').decode();assert old in s,'expected handler not found';p.write_text(s.replace(old,new,1))"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sgc.lua
          git commit -m 'fix: only auto-reopen iris after GDO authorization'
          git push
